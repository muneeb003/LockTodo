name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk LockTodo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LockTodo-apk
          path: LockTodo.apk

      - name: Publish as a release (download on your phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest LockTodo.apk \
            --title "LockTodo (latest build)" \
            --notes "Open this page on your Android phone and tap LockTodo.apk to download and install."

      - name: Save APK to the 'apk' branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          mkdir -p /tmp/out && cp LockTodo.apk /tmp/out/
          git checkout --orphan apk
          git rm -rfq .
          cp /tmp/out/LockTodo.apk .
          git add LockTodo.apk
          git commit -qm "Latest APK build"
          git push -f origin apk
